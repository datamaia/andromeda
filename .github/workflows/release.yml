# Release pipeline (Volume 11 chapter 06, ADR-013). Runs on a version tag: builds the matrix,
# signs with keyless cosign (OIDC), attaches SBOMs and provenance, and publishes the release.
# Least-privilege token; id-token for cosign. Every action is pinned to a full commit SHA
# (ADR-149) with its version in a trailing comment; Dependabot updates the pins.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # publish the GitHub Release
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned to cosign-installer v3 (cosign v2). v4 installs cosign v3, whose `sign-blob` dropped
      # `--output-signature`/`--output-certificate` (used by the goreleaser `signs` block), breaking
      # the release with "create bundle file: open :". Revisit when the signs block is migrated to
      # cosign v3's `--bundle`. Do not let Dependabot bump this to v4 until then.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo token so goreleaser can push the cask to datamaia/homebrew-tap (the
          # default GITHUB_TOKEN cannot). When unset the value is empty and the cask upload is
          # skipped (see .goreleaser.yaml skip_upload), so the release still succeeds.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
